<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 610px; height: 1298px; overflow: hidden;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 26px;
    }
    .top { padding: 54px 24px 18px; text-align: center; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; background: #333; margin: 0 auto 12px; }
    .stats { color: #a8a8a8; font-size: 22px; margin-bottom: 6px; }
    .sub { color: #a8a8a8; font-size: 22px; margin-bottom: 14px; }
    .btn { display: inline-block; border: 1px solid #555; border-radius: 10px; padding: 8px 18px; font-size: 22px; font-weight: 600; }
    .chat { padding: 20px 18px 120px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 78%; padding: 14px 18px; border-radius: 22px; line-height: 1.35; word-wrap: break-word; }
    .them { align-self: flex-start; background: #262626; color: #fff; }
    .me { align-self: flex-end; background: #8b3dff; color: #fff; }
    .photo { align-self: flex-start; max-width: 72%; border-radius: 18px; overflow: hidden; border: 1px solid #333; }
    .photo img { display: block; width: 100%; height: auto; }
    .composer { position: fixed; left: 0; right: 0; bottom: 0; height: 92px; background: #000; border-top: 1px solid #222; display: flex; align-items: center; padding: 0 18px; gap: 12px; }
    .input { flex: 1; border: 1px solid #333; border-radius: 24px; padding: 12px 18px; color: #777; font-size: 24px; }
    .icon { width: 34px; height: 34px; border-radius: 50%; background: #262626; }
  </style>
</head>
<body>
  <div class="top">
    <div class="avatar"></div>
    <div class="stats">{{STATS}} {{FOLLOWERS}} · {{POSTS}}</div>
    <div class="sub">{{NO_FOLLOW}}</div>
    <div class="btn">{{VIEW_PROFILE}}</div>
  </div>
  <div class="chat">{{MESSAGES}}</div>
  <div class="composer">
    <div class="icon"></div>
    <div class="input">{{MESSAGE_PH}}</div>
  </div>
</body>
</html>
